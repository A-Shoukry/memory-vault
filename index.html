<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Vault – free 7-day trial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --surface:#fffdf8; --surface-2:#f0ece1; --ink:#1d1b16; --muted:#6a655a; --line:#e2dccd;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --warn:#9a5700; --warn-soft:#fbead0; --topic:#7a4fc0; --danger:#b3372b; --danger-soft:#f8e0dc;
  --shadow:0 1px 2px rgba(29,27,22,.06),0 8px 24px rgba(29,27,22,.05);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13120e; --surface:#1b1914; --surface-2:#24211a; --ink:#efeadf; --muted:#9d978b; --line:#2f2c24;
    --accent:#4cc3a8; --accent-ink:#0b1f1a; --accent-soft:#16332c;
    --warn:#e6a550; --warn-soft:#33260f; --topic:#b597ee; --danger:#ef7b6e; --danger-soft:#38191a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13120e; --surface:#1b1914; --surface-2:#24211a; --ink:#efeadf; --muted:#9d978b; --line:#2f2c24;
  --accent:#4cc3a8; --accent-ink:#0b1f1a; --accent-soft:#16332c;
  --warn:#e6a550; --warn-soft:#33260f; --topic:#b597ee; --danger:#ef7b6e; --danger-soft:#38191a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:0}
h2{font-size:24px} h3{font-size:18px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.date{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:920px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:20px}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:16px}
.scope{display:flex;align-items:center;gap:8px;margin-left:auto}
.scope label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tools{display:flex;gap:8px}
.tabs{max-width:920px;margin:0 auto;padding:0 18px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.on{background:var(--ink);color:var(--bg)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--warn);color:var(--bg);font-size:12px;font-weight:600;text-align:center}
.tab.on .badge{background:var(--bg);color:var(--ink)}

/* layout */
.wrap{max-width:920px;margin:0 auto;padding:22px 18px 80px}
.stack>*+*{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card h3{margin-bottom:6px}
.sub{color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-family:'Source Serif 4',Georgia,serif;font-size:34px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.grow{flex:1 1 220px}

/* forms */
label.f{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:0 0 5px}
input[type=text],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.scope select{width:auto;padding:6px 9px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.link:hover{text-decoration:underline}

/* chips */
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.k-decision,.k-plan{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.k-idea,.k-thought{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.k-rejected{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.private{background:var(--ink);color:var(--bg);border-color:transparent}
.chip.why{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* lines */
ul.lines{list-style:none;margin:0;padding:0}
.line{padding:13px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:none}
.line .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:12px;color:var(--muted)}
.line .date{font-size:12px}
.line .txt{font-size:15px}
.line.old .txt{text-decoration:line-through;color:var(--muted)}
.line .note{font-size:12px;color:var(--muted);margin-top:3px}
.line .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
blockquote{margin:7px 0 0;padding:6px 12px;border-inline-start:3px solid var(--line);color:var(--muted);font-size:13.5px}
.pagehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 4px;font-size:13px}

/* page cards */
.page-card{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.page-card:hover{border-color:var(--accent)}
.page-card .t{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:18px;display:block}
.page-card .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:10px}

/* misc */
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:20px;margin-bottom:6px;font-weight:600}
.steps{margin:10px 0 0;padding-inline-start:20px}
.steps li{margin:5px 0}
.notice{border:1px solid var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px}
.wallnote{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center}
.group-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:6px}
.checks{margin:8px 0 0;padding-inline-start:18px;color:var(--muted);font-size:14px}
details summary{cursor:pointer;color:var(--accent);font-weight:500;margin-top:10px}
.result{border-inline-start:4px solid var(--accent)}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100% - 32px)}
.toast.bad{background:var(--danger);color:#fff}
/* knowledge map */
.mapgrid{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.mapside{padding:16px}
.mlabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:8px}
.mapchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.mchip.on{background:var(--surface-2);color:var(--ink);border-color:var(--ink)}
.maplist{display:grid;gap:3px;max-height:520px;overflow:auto}
.mrow{position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:start;background:none;border:none;border-radius:8px;padding:7px 8px 10px;cursor:pointer;font-size:14px}
.mrow:hover,.mrow.on{background:var(--surface-2)}
.mrow-t{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow-n{font-size:12.5px;color:var(--muted)}
.mrow-bar{position:absolute;left:8px;bottom:4px;height:2px;background:currentColor;border-radius:2px;max-width:calc(100% - 16px)}
.shape{display:inline-block;width:9px;height:9px;flex:0 0 auto}
.s-project{background:var(--accent)} .s-person{background:var(--warn);border-radius:50%} .s-topic{background:var(--topic);transform:rotate(45deg) scale(.85)}
.c-project{color:var(--accent)} .c-person{color:var(--warn)} .c-topic{color:var(--topic)}
.mapcanvas{padding:14px}
.maphead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mapsvg{width:100%;height:auto;display:block;max-height:78vh}
.medge{fill:none;stroke:currentColor;stroke-linecap:round}
.medge.co{stroke-dasharray:4 4}
.mshape{fill:currentColor;stroke:var(--surface);stroke-width:1.5}
.mnode{cursor:pointer;outline:none}
.mnode:focus-visible .mshape,.mnode.sel .mshape{stroke:var(--ink);stroke-width:2.5}
.mbar{stroke:currentColor;stroke-width:5;stroke-linecap:round;opacity:.55}
.mhit{fill:transparent;pointer-events:all}
.mlbl{fill:var(--ink);font-size:12px;font-family:'Inter',system-ui,sans-serif}
.mlbl.sel{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-solid,.lg-dash{display:inline-block;width:22px;border-top:2px solid var(--muted)}
.lg-dash{border-top-style:dashed}
@media (max-width:760px){.mapgrid{grid-template-columns:1fr}.mapcanvas{order:-1}}
.medge{opacity:.5;transition:opacity .35s ease}
.medge.dim{opacity:.05}
.medge.hi,.medge.hover{opacity:.95}
.medge.co.hi{animation:mvflow 1s linear infinite}
.medge.co.hi.rev{animation-direction:reverse}
@keyframes mvflow{to{stroke-dashoffset:-16}}
.mnode{transition:opacity .35s ease}
.mnode.dim{opacity:.16}
.mshape{transform-box:fill-box;transform-origin:center;transition:transform .2s ease}
.mnode:hover .mshape,.mnode:focus-visible .mshape,.mnode.sel .mshape{transform:scale(1.45)}
.mlbl{transition:opacity .3s ease}
.mlbl.hide{opacity:0}
.mapsvg.intro .medge,.mapsvg.intro .mnode{opacity:0}
@media (prefers-reduced-motion: reduce){.medge,.mnode,.mlbl,.mshape{transition:none}.medge.co.hi{animation:none}}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:640px){
  .grid3{grid-template-columns:1fr}
  .scope{margin-left:0;width:100%}
  .scope select{flex:1}
  h2{font-size:21px}
}
/* landing + buy */
.landing{max-width:780px}
.hero{margin:30px 0 26px}
.hero h1{font-size:clamp(32px,6vw,46px);line-height:1.12}
.hero p{margin-top:14px;font-size:18px;color:var(--muted);max-width:580px}
.cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
.btn.big{padding:13px 22px;font-size:16px;border-radius:12px}
ul.feat{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ul.feat li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.tick{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;margin-top:2px}
.price{border:2px solid var(--accent)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:16px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pay a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:18px;transition:border-color .15s,transform .15s}
.pay a:hover{border-color:var(--accent);transform:translateY(-1px)}
.pay a:focus-visible,.wa:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pay .method{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.pay .where{font-size:13px;color:var(--muted)}
.pay .amount{font-family:'Source Serif 4',Georgia,serif;font-size:30px;font-weight:600;line-height:1.1;margin-top:6px}
.pay .go{margin-top:8px;font-size:14px;font-weight:600;color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.small{font-size:13px;color:var(--muted);margin-top:14px}
ol.lp-steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
ol.lp-steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
ol.lp-steps li::before{content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}
.wa{display:inline-flex;align-items:center;gap:10px;margin-top:16px;background:#1f9d55;color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:12px}
.wa:hover{filter:brightness(1.06)}
.faq details{border-top:1px solid var(--line);padding:12px 0}
.faq details:first-of-type{border-top:none}
.faq summary{cursor:pointer;font-weight:600;color:var(--ink);margin-top:0}
.faq details p{margin-top:8px;color:var(--muted)}
.trialbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.trialbar.ended{background:var(--warn-soft);border-color:var(--warn)}
@media (max-width:560px){.pay{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ===================== constants ===================== */
const KEY='memoryVault.v1', THEME_KEY='memoryVault.theme';
const KINDS=['decision','update','plan','idea','preference','thought','outcome','rejected'];
const KIND_LABEL={decision:'Decision',update:'Update',plan:'Plan',idea:'Idea',preference:'Preference',thought:'Thought',outcome:'Outcome',rejected:'Rejected option'};
const KIND_ORDER=['decision','preference','plan','idea','outcome','rejected','update','thought'];
const TYPES=['project','person','topic'];
const SOURCES=['you','ai-checked','ai-confirmed'];
const SOURCE_LABEL={'you':'Yours','ai-checked':'AI · passed checks','ai-confirmed':'AI · you confirmed'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ===================== utils ===================== */
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
function localDate(d){d=d||new Date();const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return localDate(d);}
function fmtDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));return m?(+m[3])+' '+MONTHS[+m[2]-1]+' '+m[1]:String(s||'');}
const str=v=>(v==null?'':String(v)).trim();
function normalizeDigits(s){return String(s||'').replace(/[\u0660-\u0669]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[\u06F0-\u06F9]/g,c=>String(c.charCodeAt(0)-1776));}
const stripCommas=s=>s.replace(/(\d)[,\u066C](?=\d)/g,'$1');
const normText=s=>stripCommas(normalizeDigits(String(s||'')).toLowerCase().replace(/\s+/g,' ').trim());
const numbersIn=s=>stripCommas(normalizeDigits(String(s||''))).match(/\d+(?:\.\d+)?/g)||[];

/* ===================== storage ===================== */
let storageOK=true;
function readStore(k){try{return localStorage.getItem(k);}catch(e){storageOK=false;return null;}}
function writeStore(k,v){try{localStorage.setItem(k,v);}catch(e){storageOK=false;}}
try{localStorage.setItem('__mv_probe','1');localStorage.removeItem('__mv_probe');}catch(e){storageOK=false;}

function fresh(){return {v:1,folders:[{id:'f_general',name:'General',private:false}],pages:[],held:[],scope:'open'};}
function sanitize(s){
  const o=fresh(); if(!s||typeof s!=='object') return o;
  if(Array.isArray(s.folders)){
    const fs=s.folders.filter(f=>f&&f.id&&typeof f.name==='string').map(f=>({id:String(f.id),name:f.name,private:!!f.private}));
    if(fs.length) o.folders=fs;
  }
  if(!o.folders.some(f=>!f.private)) o.folders.unshift({id:'f_general',name:'General',private:false});
  const openId=o.folders.find(f=>!f.private).id;
  if(Array.isArray(s.pages)) o.pages=s.pages.filter(p=>p&&p.id&&typeof p.title==='string').map(p=>({
    id:String(p.id),title:p.title,type:TYPES.includes(p.type)?p.type:'project',
    folderId:o.folders.some(f=>f.id===p.folderId)?p.folderId:openId,
    status:typeof p.status==='string'?p.status:'',
    statusHistory:Array.isArray(p.statusHistory)?p.statusHistory.filter(x=>x&&typeof x.status==='string').map(x=>({status:x.status,until:String(x.until||'')})):[],
    created:String(p.created||localDate()),
    links:Array.isArray(p.links)?p.links.map(String):[],
    lines:Array.isArray(p.lines)?p.lines.filter(l=>l&&l.id&&typeof l.text==='string').map(l=>({
      id:String(l.id),date:String(l.date||localDate()),ts:Number(l.ts)||0,
      kind:KINDS.includes(l.kind)?l.kind:'thought',text:l.text,quote:typeof l.quote==='string'?l.quote:'',
      source:SOURCES.includes(l.source)?l.source:'you',replacedOn:l.replacedOn?String(l.replacedOn):null,replacedBy:l.replacedBy?String(l.replacedBy):null
    })):[]
  }));
  const pids=new Set(o.pages.map(p=>p.id));
  o.pages.forEach(p=>{p.links=[...new Set(p.links.filter(id=>pids.has(id)&&id!==p.id))];});
  if(Array.isArray(s.held)) o.held=s.held.filter(h=>h&&h.id&&typeof h.statement==='string').map(h=>({
    id:String(h.id),subject:str(h.subject)||'Unsorted',pageId:h.pageId?String(h.pageId):null,pageTitle:str(h.pageTitle),
    kind:KINDS.includes(h.kind)?h.kind:'update',statement:h.statement,quote:typeof h.quote==='string'?h.quote:'',
    reasons:Array.isArray(h.reasons)?h.reasons.map(String):[],created:String(h.created||localDate()),
    folderId:o.folders.some(f=>f.id===h.folderId)?h.folderId:openId
  }));
  o.scope=(s.scope&&o.folders.some(f=>f.id===s.scope))?s.scope:'open';
  return o;
}
function load(){const raw=readStore(KEY);if(!raw)return fresh();try{return sanitize(JSON.parse(raw));}catch(e){return fresh();}}
let state=load();

/* ===================== undo ===================== */
const undoStack=[];
function snapshot(label){undoStack.push({label:label,data:JSON.stringify(state)});if(undoStack.length>30)undoStack.shift();}
function undo(){
  const s=undoStack.pop(); if(!s){toast('Nothing to undo.');return;}
  const keep=state.scope; state=sanitize(JSON.parse(s.data));
  state.scope=state.folders.some(f=>f.id===keep)?keep:'open';
  save(); render(); toast('Undone: '+s.label);
}
function act(label,fn){
  const ls=licStatus();
  if(ls.mode!=='trial'&&ls.mode!=='paid'&&!LOCKED_OK.has(label)){
    toast(ls.mode==='expired'?'Your free trial has ended. Enter your access code to keep adding and changing notes.':'Start your free trial first.','bad');
    return {ok:false};
  }
  snapshot(label);
  try{const value=fn();save();render();return {ok:true,value:value};}
  catch(e){
    const s=undoStack.pop(); const keep=state.scope;
    if(s){state=sanitize(JSON.parse(s.data));state.scope=state.folders.some(f=>f.id===keep)?keep:'open';}
    render(); toast(e.message||'Something went wrong.','bad'); return {ok:false};
  }
}

function parseFacts(raw){
  let s=String(raw||'').trim(); if(!s) throw new Error('Paste your AI\'s reply first.');
  const a=s.indexOf('['), b=s.lastIndexOf(']');
  if(a<0||b<a) throw new Error('I could not find a JSON list in that reply.');
  let arr; try{arr=JSON.parse(s.slice(a,b+1));}catch(e){throw new Error('That reply is not valid JSON. Ask your AI to reply with the list only.');}
  if(!Array.isArray(arr)) throw new Error('Expected a list of facts.');
  return arr;
}
function runDistill(srcText,facts){
  const src=normText(srcText);
  const out={filed:[],held:[]};
  for(const f of facts){
    if(!f||typeof f!=='object') continue;
    const subject=str(f.subject), statement=str(f.statement), quote=str(f.quote), pageTitle=str(f.page);
    if(!statement) continue;
    const kindRaw=String(f.kind||'').toLowerCase();
    const kind=KINDS.includes(kindRaw)?kindRaw:'update';
    const reasons=[];
    const q=normText(quote);
    if(!q||!src.includes(q)) reasons.push('the quote is not in the text you pasted');
    else{
      if(subject&&!q.includes(normText(subject))) reasons.push('the subject is not in the quote');
      const missing=numbersIn(statement).find(n=>!q.includes(n));
      if(missing) reasons.push('the number '+missing+' is not in the quote');
    }
    if(String(f.said_by||'').toLowerCase()!=='me') reasons.push('not marked as said by you');
    const target=(pageTitle&&findVisibleByTitle(pageTitle))||(subject&&findVisibleByTitle(subject))||null;
    if(!target) reasons.push('no page exists yet');
    if(!reasons.length){
      addLine(target,{kind:kind,text:statement,quote:quote,source:'ai-checked'});
      out.filed.push({page:target.title,statement:statement});
    }else{
      const item={id:uid(),subject:subject||pageTitle||'Unsorted',pageId:target?target.id:null,pageTitle:pageTitle||subject,kind:kind,statement:statement,quote:quote,reasons:reasons,created:localDate(),folderId:defaultFolderId()};
      state.held.push(item); out.held.push({subject:item.subject,statement:statement,reasons:reasons});
    }
  }
  return out;
}
function acceptHeld(id,type){

  const h=state.held[i]; if(!canSeeHeld(h)) throw new Error('That item belongs to a private folder.');
  let page=h.pageId?visiblePageById(h.pageId):null;

}

function linkPages(aId,bId){

/* does a note name a page? whole words only, case- and digit-insensitive */
function titleHit(text,title){
  const t=normText(title); if(t.length<3) return false;
  const s=normText(text); let i=s.indexOf(t);
  while(i>=0){
    const b=s[i-1], a=s[i+t.length];
    if((!b||!/[\p{L}\p{N}]/u.test(b))&&(!a||!/[\p{L}\p{N}]/u.test(a))) return true;
    i=s.indexOf(t,i+1);
  }
  return false;
}
/* the map: only pages visible in the current view, so private walls hold */
function buildGraph(types){
  types=types||{project:true,person:true,topic:true};
  const pages=visiblePages().filter(p=>types[p.type]!==false);
  const byId=new Map(pages.map(p=>[p.id,p]));
  const size=new Map(pages.map(p=>[p.id,0]));
  const edges=new Map();
  const edge=(x,y)=>{const a=x<y?x:y,b=x<y?y:x,k=a+'|'+b;if(!edges.has(k))edges.set(k,{a:a,b:b,linked:false,co:0});return edges.get(k);};
  for(const p of pages){
    for(const l of p.lines){
      if(l.replacedOn) continue;
      const txt=l.text+' '+(l.quote||'');
      const ids=new Set([p.id]);
      for(const q of pages) if(q.id!==p.id&&titleHit(txt,q.title)) ids.add(q.id);
      ids.forEach(id=>size.set(id,size.get(id)+1));
      const arr=[...ids];
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++) edge(arr[i],arr[j]).co++;
    }
    for(const id of (p.links||[])) if(byId.has(id)&&id!==p.id) edge(p.id,id).linked=true;
  }
  return {nodes:pages.map(p=>({id:p.id,title:p.title,type:p.type,size:size.get(p.id)})),edges:[...edges.values()]};
}

function deleteFolder(id){

function searchPages(q){
  const k=normText(q); const pages=visiblePages().sort(byActivity);
  if(!k) return pages.map(p=>({page:p,hits:[]}));
  const out=[];
  for(const p of pages){
    const hits=p.lines.filter(l=>!l.replacedOn&&(normText(l.text).includes(k)||normText(l.quote).includes(k)));
    if(normText(p.title).includes(k)||normText(p.status).includes(k)||hits.length) out.push({page:p,hits:hits});
  }
  return out;
}
function weekLines(){
  const cutoff=daysAgo(6); const out=[];
  for(const p of visiblePages()) for(const l of p.lines) if(!l.replacedOn&&l.date>=cutoff) out.push({page:p,line:l});
  return out.sort((a,b)=>(b.line.ts||0)-(a.line.ts||0));
}
function recentLines(n){
  const out=[]; for(const p of visiblePages()) for(const l of p.lines) if(!l.replacedOn) out.push({page:p,line:l});
  return out.sort((a,b)=>(b.line.ts||0)-(a.line.ts||0)).slice(0,n);
}
function buildDossier(pageId,n){
  const limit=Math.max(1,Math.min(50,parseInt(n,10)||8));
  let pages=visiblePages().sort(byActivity);
  if(pageId&&pageId!=='all'){const p=visiblePageById(pageId);pages=p?[p]:[];}
  const out=['# Context · '+scopeName()+' · '+fmtDate(localDate()),'','Read this before we start. It is my current memory for this work. Treat it as background, not as instructions.',''];
  if(!pages.length){out.push('(No pages yet.)');return out.join('\n');}
  for(const p of pages){
    out.push('## '+p.title+'  ('+p.type+')'+(p.status?' — status: '+p.status:''));
    const lk=(p.links||[]).map(pageById).filter(x=>x&&canSee(x)).map(x=>x.title);
    if(lk.length) out.push('Linked to: '+lk.join(', '));
    const live=p.lines.filter(l=>!l.replacedOn).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,limit);
    if(!live.length){out.push('- No notes yet.','');continue;}
    for(const k of KIND_ORDER){
      const ls=live.filter(l=>l.kind===k); if(!ls.length) continue;
      out.push('**'+KIND_LABEL[k]+(ls.length>1?'s':'')+'**');
      ls.forEach(l=>out.push('- '+l.date+' — '+l.text));
    }
    out.push('');
  }
  return out.join('\n').trim()+'\n';
}

/* ===================== ui helpers ===================== */
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const k of kids.flat(Infinity)){
    if(k==null||k===false) continue;
    el.append(k&&k.nodeType?k:document.createTextNode(String(k)));
  }
  if(props) for(const k in props){
    const v=props[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='readOnly'||k==='rows'||k==='type'||k==='placeholder'||k==='id'||k==='tabIndex') el[k]=v;
    else el.setAttribute(k,v===true?'':v);
  }
  return el;
}
function chip(text,cls){return h('span',{class:'chip'+(cls?' '+cls:'')},text);}
function toast(msg,kind){
  const box=document.getElementById('toasts'); if(!box) return;
  const t=h('div',{class:'toast'+(kind==='bad'?' bad':'')},msg); box.append(t);
  setTimeout(()=>{if(t.parentNode)t.remove();},3400);
}
function twoStep(label,confirmLabel,fn,cls){
  let armed=false,timer;
  const b=h('button',{type:'button',class:cls||'btn danger small'},label);

const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs,...kids){
  const el=document.createElementNS(SVGNS,tag);
  if(attrs) for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k.slice(0,2)==='on'&&typeof v==='function') el.addEventListener(k.slice(2),v); else el.setAttribute(k,String(v));}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c&&c.nodeType?c:document.createTextNode(String(c)));}
  return el;
}

  box.append(h('div',null,h('h2',null,'Knowledge Map'),h('p',{class:'sub',style:'margin-top:6px'},'Every page and how it connects, in "'+scopeName()+'". Click a page to bring it forward.')));
  if(!all.nodes.length){draft.mapAnimate=false;box.append(h('div',{class:'card empty'},h('b',null,'Nothing to map yet'),'Add notes to a few pages. When a note names another page, a line appears between them.'));return box;}

  const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const titleById=id=>{const n=g.nodes.find(x=>x.id===id);return n?n.title:'';};

        h('button',{type:'button',class:'btn primary big',id:'start_trial',onclick:()=>{startTrial();view='home';render();window.scrollTo(0,0);toast('Your 7-day free trial has started. Enjoy!');}},'Start your 7-day free trial'),
        h('span',{class:'sub'},'No account, no card. Everything unlocked for 7 days.'))),
    h('div',{class:'stack'},
      h('section',{class:'card'},h('h2',null,'What you get'),h('ul',{class:'feat'},feats.map(([b,t])=>h('li',null,h('span',{class:'tick'},'\u2713'),h('span',null,h('b',null,b),' '+t))))),
      payCard(),codeCard(),stepsCard(),faqCard()),
    h('p',{class:'foot'},'Questions before you buy? Message us on ',h('a',{href:PAY.waPlain,target:'_blank',rel:'noopener',style:'color:inherit'},'WhatsApp'),'.'));
}
function buyView(){
  const st=licStatus();
  const sub=st.mode==='trial'?'Your free trial has '+st.daysLeft+' day'+(st.daysLeft>1?'s':'')+' left. Buy once and keep everything you have added.':
    st.mode==='expired'?'Your free trial has ended. Your notes are safe. Unlock to keep adding and changing them.':
    st.mode==='paid'?'Memory Vault is unlocked for '+st.name+'. Thank you!':'';
  return h('div',{class:'stack'},
    h('div',null,h('h2',null,st.mode==='paid'?'You have lifetime access':'Lifetime access'),h('p',{class:'sub',style:'margin-top:6px'},sub)),
    st.mode==='paid'?null:payCard(),st.mode==='paid'?null:codeCard(),st.mode==='paid'?null:stepsCard());
}
function licBanner(){
  const st=licStatus();
  if(st.mode==='trial') return h('div',{class:'wrap',style:'padding-bottom:0;padding-top:14px'},h('div',{class:'trialbar',id:'trialbar'},
    h('span',null,'Free trial: ',h('b',null,st.daysLeft+' day'+(st.daysLeft>1?'s':'')+' left')),
    h('button',{type:'button',class:'btn primary small',onclick:()=>go('buy')},'Buy lifetime access')));
  if(st.mode==='expired') return h('div',{class:'wrap',style:'padding-bottom:0;padding-top:14px'},h('div',{class:'trialbar ended',id:'trialbar'},
    h('span',null,h('b',null,'Your free trial has ended.'),' Your notes are safe and you can still read them. Unlock to keep adding notes.'),
    h('button',{type:'button',class:'btn primary small',onclick:()=>go('buy')},'Unlock')));
  return null;
}
function render(){
  const root=document.getElementById('app'); root.textContent='';
  if(licStatus().mode==='new'){root.append(landingView());return;}
  root.append(header(),licBanner(),banner(),main());
}

if(savedTheme==='light'||savedTheme==='dark') document.documentElement.setAttribute('data-theme',savedTheme);
